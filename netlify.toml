# netlify.toml — ไฟล์ตั้งค่าการนำเว็บขึ้นใช้งานจริงบน Netlify
#
# Netlify จะอ่านไฟล์นี้อัตโนมัติทุกครั้งที่ deploy
# เจ้าของงานจึงไม่ต้องไปกรอกค่าเหล่านี้ซ้ำในหน้าเว็บ Netlify
# (ยกเว้นตัวแปรลับ ซึ่งต้องกรอกในหน้าเว็บเท่านั้น ดูไฟล์ DEPLOY_ENV.md)

[build]
  # คำสั่งที่ Netlify จะรันเพื่อสร้างไฟล์เว็บ ตรงกับที่ใช้ในเครื่องตัวเอง
  command = "npm run build"

  # โฟลเดอร์ผลลัพธ์ที่จะถูกนำขึ้นเว็บ
  # โปรเจกต์นี้ไม่มีไฟล์ vite.config จึงใช้ค่าตั้งต้นของ Vite คือ dist
  # (ตรวจแล้วว่าคำสั่ง npm run build สร้างโฟลเดอร์ dist ออกมาจริง)
  publish = "dist"

[build.environment]
  # ล็อกรุ่นของ Node ให้ตรงกับที่ใช้พัฒนา
  # ถ้าไม่ล็อกไว้ Netlify อาจเลือกรุ่นเก่ากว่าและ build ไม่ผ่านโดยไม่มีสาเหตุที่เดาได้
  NODE_VERSION = "22"

# ---------------------------------------------------------------------
# กฎสำคัญที่สุดของไฟล์นี้ — ส่งทุกที่อยู่กลับไปที่ index.html
#
# เว็บนี้เป็นเว็บหน้าเดียวที่วาดเนื้อหาใหม่เมื่อเปลี่ยนที่อยู่
# บนเครื่องตัวเองมีตัวช่วยจัดการให้อยู่แล้ว แต่บนเซิร์ฟเวอร์จริงไม่มี
#
# ถ้าไม่มีกฎนี้ ผู้ใช้ที่กด F5 รีเฟรชขณะอยู่หน้า /history หรือ /doc/xxx
# จะเจอหน้า 404 ทันที เพราะเซิร์ฟเวอร์ไปหาไฟล์ชื่อ history จริง ๆ แล้วไม่เจอ
#
# status = 200 หมายถึงให้ส่ง index.html กลับไปโดยที่อยู่บนแถบยังเป็นอันเดิม
# ถ้าใช้ 301 หรือ 302 ที่อยู่จะถูกเปลี่ยนเป็น / แล้วผู้ใช้จะหลุดออกจากหน้าที่ดูอยู่
# ---------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# ส่วนเสริมความปลอดภัยของหัวข้อมูลที่ส่งให้เบราว์เซอร์
# เป็นการตั้งค่ามาตรฐานที่ไม่กระทบการใช้งาน แต่ช่วยลดความเสี่ยง
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]
    # ห้ามให้เว็บอื่นเอาเว็บนี้ไปฝังในกรอบของตัวเอง (กันการหลอกให้กดผิด)
    X-Frame-Options = "DENY"

    # ห้ามเบราว์เซอร์เดาชนิดไฟล์เอง ให้เชื่อตามที่เซิร์ฟเวอร์บอกเท่านั้น
    X-Content-Type-Options = "nosniff"

    # ไม่ส่งที่อยู่หน้าเว็บของเราไปให้เว็บอื่นเวลาผู้ใช้กดลิงก์ออกไป
    Referrer-Policy = "strict-origin-when-cross-origin"
